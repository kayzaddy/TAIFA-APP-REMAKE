version: 2
updates:
  - package-ecosystem: pip
    directory: "/apps/backend"
    schedule:
      interval: weekly
    open-pull-requests-limit: 10

  - package-ecosystem: pub
    directory: "/apps/mobile"
    schedule:
      interval: weekly
    open-pull-requests-limit: 10

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
