# Reverse proxy for the TAIFA payment service.
#
# This terminates HTTP on :80 and proxies to gunicorn. For production, put this
# behind a TLS terminator (managed LB, or add a 443 server block with certs from
# Let's Encrypt) and set X-Forwarded-Proto=https so Django's SSL settings apply.

upstream taifa_web {
    server web:8000;
}

server {
    listen 80;
    server_name _;

    client_max_body_size 2m;

    # Serve collected static assets directly (admin, Swagger UI).
    location /static/ {
        alias /var/www/static/;
        access_log off;
        expires 7d;
    }

    # Health probes + metrics bypass upstream buffering.
    location = /healthz { proxy_pass http://taifa_web; }
    location = /readyz  { proxy_pass http://taifa_web; }
    location = /startupz { proxy_pass http://taifa_web; }
    location = /depsz { proxy_pass http://taifa_web; }
    location = /metrics { proxy_pass http://taifa_web; }

    location / {
        proxy_pass http://taifa_web;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $request_id;
        proxy_read_timeout 60s;
    }
}
