# Production-shaped stack: Postgres + Redis + gunicorn web + Celery worker/beat,
# fronted by nginx. Secrets from git-ignored `.env`:
#
#   docker compose -f docker-compose.prod.yml --env-file .env up -d --build
#
# Scale web/workers: docker compose -f docker-compose.prod.yml up -d --scale web=3 --scale worker=2
# Observability stack: docker compose -f docker-compose.observability.yml up -d
#
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-taifa}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-taifa_payments}
    volumes:
      - taifa_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-taifa}"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes: ["taifa_redis:/data"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  release:
    build: .
    command: sh -c "python manage.py migrate --noinput && python manage.py collectstatic --noinput"
    env_file: [.env]
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-taifa}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-taifa_payments}
    volumes: ["taifa_static:/app/staticfiles"]
    depends_on:
      db: {condition: service_healthy}

  web:
    build: .
    command: >
      gunicorn config.asgi:application
      -k uvicorn.workers.UvicornWorker
      --bind 0.0.0.0:8000
      --workers ${GUNICORN_WORKERS:-3}
      --timeout 60
      --access-logfile -
      --error-logfile -
    env_file: [.env]
    environment:
      DJANGO_DEBUG: "false"
      TAIFA_LOG_JSON: "true"
      TAIFA_ENVIRONMENT: ${TAIFA_ENVIRONMENT:-production}
      DATABASE_URL: postgres://${POSTGRES_USER:-taifa}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-taifa_payments}
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
      CELERY_TASK_ALWAYS_EAGER: "false"
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      OTEL_SERVICE_NAME: taifa-payments
    volumes: ["taifa_static:/app/staticfiles"]
    expose: ["8000"]
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/readyz').status==200 else 1)\"",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 40s
    depends_on:
      db: {condition: service_healthy}
      redis: {condition: service_healthy}
      release: {condition: service_completed_successfully}
    restart: unless-stopped

  worker:
    build: .
    command: celery -A config worker -l info --concurrency=${CELERY_CONCURRENCY:-4}
    env_file: [.env]
    environment:
      DJANGO_DEBUG: "false"
      TAIFA_LOG_JSON: "true"
      TAIFA_ENVIRONMENT: ${TAIFA_ENVIRONMENT:-production}
      DATABASE_URL: postgres://${POSTGRES_USER:-taifa}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-taifa_payments}
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
      CELERY_TASK_ALWAYS_EAGER: "false"
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      OTEL_SERVICE_NAME: taifa-payments-worker
    depends_on:
      db: {condition: service_healthy}
      redis: {condition: service_healthy}
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "celery -A config inspect ping -d celery@$$HOSTNAME || exit 1",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  beat:
    build: .
    command: celery -A config beat -l info
    env_file: [.env]
    environment:
      DJANGO_DEBUG: "false"
      TAIFA_LOG_JSON: "true"
      DATABASE_URL: postgres://${POSTGRES_USER:-taifa}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-taifa_payments}
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
      CELERY_TASK_ALWAYS_EAGER: "false"
    depends_on:
      db: {condition: service_healthy}
      redis: {condition: service_healthy}
      worker: {condition: service_started}
    restart: unless-stopped

  nginx:
    image: nginx:1.27-alpine
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - taifa_static:/var/www/static:ro
    ports: ["80:80"]
    depends_on:
      web: {condition: service_healthy}
    restart: unless-stopped

volumes:
  taifa_pgdata:
  taifa_redis:
  taifa_static:
