# Local production-shaped stack: Postgres + Redis + web + Celery worker.
# For day-to-day dev you can skip this and use the SQLite fallback.
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: taifa
      POSTGRES_PASSWORD: taifa
      POSTGRES_DB: taifa_payments
    ports: ["5432:5432"]
    volumes: ["taifa_pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U taifa"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]

  web:
    build: .
    command: >
      sh -c "python manage.py migrate &&
             gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 3"
    environment:
      DATABASE_URL: postgres://taifa:taifa@db:5432/taifa_payments
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
      CELERY_TASK_ALWAYS_EAGER: "false"
      DJANGO_DEBUG: "false"
    ports: ["8000:8000"]
    depends_on:
      db: {condition: service_healthy}
      redis: {condition: service_started}

  worker:
    build: .
    command: celery -A config worker -l info
    environment:
      DATABASE_URL: postgres://taifa:taifa@db:5432/taifa_payments
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
      CELERY_TASK_ALWAYS_EAGER: "false"
    depends_on:
      db: {condition: service_healthy}
      redis: {condition: service_started}

volumes:
  taifa_pgdata:
