  /api/v1/auth/device/register:
    post:
      operationId: api_v1_auth_device_register_create
      description: |-
        POST /api/v1/auth/device/register — bind a device and mint a token.

        Open (no token yet). Idempotent per `device_id`: re-registering rotates the
        token and keeps the same owner/wallet. Demo funding only when
        `ALLOW_DEMO_WALLET_FUNDING` is true (forbidden in production).
      summary: Register a device and mint a bound token
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeviceRegister'
        required: true
      security:
      - {}
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeviceRegisterResponse'
          description: ''
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeviceRegisterResponse'
          description: ''
