components:
  schemas:
    AcceptedLocationBatch:
      type: object
      properties:
        accepted:
          type: integer
      required:
      - accepted
    AdminCase:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        owner:
          type: string
          readOnly: true
        kind:
          $ref: '#/components/schemas/AdminCaseKindEnum'
        status:
          $ref: '#/components/schemas/AdminCaseStatusEnum'
        title:
          type: string
          maxLength: 128
        subject:
          type: string
          maxLength: 255
        detail:
          type: string
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_at
      - id
      - owner
      - subject
      - title
      - updated_at
    AdminCaseCreate:
      type: object
      properties:
        kind:
          type: string
          default: kyc
        status:
          type: string
          default: open
        title:
          type: string
        subject:
          type: string
        detail:
          type: string
          default: ''
      required:
      - subject
      - title
    AdminCaseKindEnum:
      enum:
      - kyc
      - dispute
      - freeze
      type: string
      description: |-
        * `kyc` - Kyc
        * `dispute` - Dispute
        * `freeze` - Freeze
    AdminCaseStatusEnum:
      enum:
      - open
      - reviewing
      - resolved
      type: string
      description: |-
        * `open` - Open
        * `reviewing` - Reviewing
        * `resolved` - Resolved
    Application:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        application_number:
          type: string
          readOnly: true
        application_type:
          allOf:
          - $ref: '#/components/schemas/ApplicationApplicationTypeEnum'
          readOnly: true
        applicant_principal:
          type: string
          readOnly: true
        status:
          allOf:
          - $ref: '#/components/schemas/ApplicationStatusEnum'
          readOnly: true
        stage:
          allOf:
          - $ref: '#/components/schemas/StageEnum'
          readOnly: true
        region:
          type: string
          readOnly: true
        district:
          type: string
          readOnly: true
        assigned_reviewer:
          type: string
          readOnly: true
        rejection_reason:
          type: string
          readOnly: true
        approval_reference:
          type: string
          readOnly: true
          nullable: true
        operational_object_id:
          type: string
          format: uuid
          readOnly: true
          nullable: true
        version:
          type: integer
          readOnly: true
        submitted_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        approved_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        rejected_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        suspended_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
        document_counts:
          type: object
          additionalProperties: {}
          readOnly: true
        profile:
          type: object
          additionalProperties: {}
          readOnly: true
      required:
      - applicant_principal
      - application_number
      - application_type
      - approval_reference
      - approved_at
      - assigned_reviewer
      - created_at
      - district
      - document_counts
      - id
      - operational_object_id
      - profile
      - region
      - rejected_at
      - rejection_reason
      - stage
      - status
      - submitted_at
      - suspended_at
      - updated_at
      - version
    ApplicationApplicationTypeEnum:
      enum:
      - driver
      - vehicle
      - station
      - fleet
      - transport_company
      type: string
      description: |-
        * `driver` - Driver
        * `vehicle` - Vehicle
        * `station` - Station
        * `fleet` - Fleet
        * `transport_company` - Transport Company
    ApplicationStatusEnum:
      enum:
      - draft
      - submitted
      - pending_review
      - documents_missing
      - rejected
      - suspended
      - approved
      - blocked
      type: string
      description: |-
        * `draft` - Draft
        * `submitted` - Submitted
        * `pending_review` - Pending Review
        * `documents_missing` - Documents Missing
        * `rejected` - Rejected
        * `suspended` - Suspended
        * `approved` - Approved
        * `blocked` - Blocked
    Blacklist:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        identifier_type:
          type: string
          readOnly: true
        reason:
          type: string
          readOnly: true
        active:
          type: boolean
          readOnly: true
        created_by:
          type: string
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        expires_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
      required:
      - active
      - created_at
      - created_by
      - expires_at
      - id
      - identifier_type
      - reason
    BlacklistCreate:
      type: object
      properties:
        identifier_type:
          $ref: '#/components/schemas/IdentifierTypeEnum'
        identifier:
          type: string
          writeOnly: true
          maxLength: 128
        reason:
          type: string
          maxLength: 500
      required:
      - identifier
      - identifier_type
      - reason
    CategoryEnum:
      enum:
      - food
      - medicine
      - documents
      - package
      - business
      - parcel
      - corporate_logistics
      type: string
      description: |-
        * `food` - food
        * `medicine` - medicine
        * `documents` - documents
        * `package` - package
        * `business` - business
        * `parcel` - parcel
        * `corporate_logistics` - corporate_logistics
    ChatMessage:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        owner:
          type: string
          readOnly: true
        thread:
          type: string
          format: uuid
          readOnly: true
        sender:
          type: string
          maxLength: 16
        text:
          type: string
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_at
      - id
      - owner
      - text
      - thread
    ChatMessageCreate:
      type: object
      properties:
        sender:
          type: string
          default: me
        text:
          type: string
      required:
      - text
    ChatThread:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        owner:
          type: string
          readOnly: true
        title:
          type: string
          maxLength: 128
        subtitle:
          type: string
          maxLength: 255
        unread:
          type: integer
          maximum: 9223372036854775807
          minimum: 0
          format: int64
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_at
      - id
      - owner
      - title
      - updated_at
    ChatThreadCreate:
      type: object
      properties:
        title:
          type: string
        subtitle:
          type: string
          default: ''
        unread:
          type: integer
          minimum: 0
          default: 0
      required:
      - title
    ComplianceDashboard:
      type: object
      properties:
        open_findings:
          type: object
          additionalProperties:
            type: integer
        documents_expiring:
          type: object
          additionalProperties:
            type: integer
        expired_documents:
          type: integer
        suspended_applications:
          type: integer
        blocked_applications:
          type: integer
        notification_backlog:
          type: integer
      required:
      - blocked_applications
      - documents_expiring
      - expired_documents
      - notification_backlog
      - open_findings
      - suspended_applications
    CurrencyEnum:
      enum:
      - TZS
      - USD
      - EUR
      - KES
      - UGX
      - RWF
      - BIF
      - ZMW
      - MWK
      - CDF
      - BTC
      type: string
      description: |-
        * `TZS` - Tanzanian Shilling
        * `USD` - US Dollar
        * `EUR` - Euro
        * `KES` - Kenyan Shilling
        * `UGX` - Ugandan Shilling
        * `RWF` - Rwandan Franc
        * `BIF` - Burundian Franc
        * `ZMW` - Zambian Kwacha
        * `MWK` - Malawian Kwacha
        * `CDF` - Congolese Franc
        * `BTC` - Bitcoin
    DecisionEnum:
      enum:
      - verified
      - rejected
      type: string
      description: |-
        * `verified` - verified
        * `rejected` - rejected
    Delivery:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        trip:
          type: string
          format: uuid
        category:
          type: string
          maxLength: 24
        recipient_name:
          type: string
          maxLength: 128
        recipient_phone_masked:
          type: string
          maxLength: 32
        package_notes:
          type: string
          maxLength: 500
        proof_status:
          type: string
          readOnly: true
        proof_metadata:
          readOnly: true
        delivered_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
      required:
      - category
      - delivered_at
      - id
      - proof_metadata
      - proof_status
      - recipient_name
      - recipient_phone_masked
      - trip
    DeliveryCreate:
      type: object
      properties:
        trip:
          type: string
          format: uuid
        category:
          $ref: '#/components/schemas/CategoryEnum'
        recipient_name:
          type: string
          maxLength: 128
        recipient_phone_masked:
          type: string
          maxLength: 32
        recipient_verification_code:
          type: string
          writeOnly: true
          maxLength: 12
          minLength: 4
        package_notes:
          type: string
          default: ''
          maxLength: 500
      required:
      - category
      - recipient_name
      - recipient_phone_masked
      - recipient_verification_code
      - trip
    DeviceRegister:
      type: object
      properties:
        device_id:
          type: string
          maxLength: 128
        label:
          type: string
          default: ''
        platform:
          type: string
          default: ''
      required:
      - device_id
    DeviceRegisterResponse:
      type: object
      description: Response shape for device registration (documentation only).
      properties:
        token:
          type: string
        device_id:
          type: string
        owner:
          type: string
        currency:
          type: string
        balance_minor:
          type: integer
        balance_display:
          type: string
      required:
      - balance_display
      - balance_minor
      - currency
      - device_id
      - owner
      - token
    DirectionEnum:
      enum:
